<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://cdn.dtodo.cn https://ddragon.leagueoflegends.com data:; style-src 'self' 'unsafe-inline'">
<title>ARAM Helper Overlay</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="panel.css">
<style>
  html, body { background: transparent !important; overflow: hidden; width: 100vw; height: 100vh; user-select: none; }
  #badges, #toast, #tab { position: absolute; }
  .badge {
    position: absolute;
    transform: translate(-50%, -100%);
    background: rgba(8, 12, 20, 0.88);
    border: 2px solid var(--t5);
    border-radius: 8px;
    padding: 4px 10px;
    white-space: nowrap;
    text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.6);
  }
  .badge .main { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 15px; font-weight: 700; }
  .badge .tier { font-size: 15px; }
  .badge .sub { font-size: 11px; color: var(--muted); }
  .badge .best { color: #ffd166; font-size: 12px; }
  .badge .guide { color: var(--gold2); font-size: 12px; margin-top: 2px; }
  .badge.b1 { border-color: var(--t1); } .badge.b2 { border-color: var(--t2); } .badge.b3 { border-color: var(--t3); } .badge.b4 { border-color: var(--t4); }
  .badge.top { box-shadow: 0 0 14px rgba(255, 209, 102, .7); }
  #toast { top: 12%; left: 50%; transform: translateX(-50%); background: rgba(8,12,20,.9); border: 1px solid var(--gold); color: var(--gold2); padding: 8px 18px; border-radius: 8px; font-size: 15px; display: none; }
  #scanBtn {
    position: absolute; display: none; padding: 6px 12px; border-radius: 18px; font-size: 13px; font-weight: 700;
    color: var(--gold2); background: rgba(8, 12, 20, 0.55); border: 1px solid rgba(200, 170, 110, 0.5);
    cursor: pointer; opacity: 0.6; transition: opacity .15s;
  }
  #scanBtn:hover { opacity: 1; background: rgba(8, 12, 20, 0.92); border-color: var(--gold); }
  #scanBtn.busy { opacity: 1; border-color: var(--blue); color: var(--blue); }
  .badge .guess { color: #f59e0b; font-size: 11px; }
  #scanStatus {
    position: absolute; display: none; top: 7%; left: 50%; transform: translateX(-50%); min-width: 280px;
    background: rgba(8, 12, 20, 0.9); border: 1px solid var(--gold); border-radius: 10px; padding: 8px 14px; text-align: center;
  }
  #scanStatus .label { color: var(--gold2); font-size: 14px; font-weight: 700; }
  #scanStatus .label.ok { color: #86efac; } #scanStatus .label.bad { color: #fca5a5; }
  #scanStatus .bar { height: 6px; margin: 6px 0 2px; background: #1a2333; border-radius: 3px; overflow: hidden; }
  #scanStatus .fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--gold)); transition: width .12s linear; }
  #scanStatus .meta { font-size: 11px; color: var(--muted); }
  #tab, #guides { position: absolute; display: none; max-height: calc(100vh - 140px); overflow: hidden; }
  #tab .build-panel, #guides .guides-panel { background: rgba(8, 12, 20, 0.92); border: 1px solid var(--gold); border-radius: 10px; padding: 12px; }
  .guide-box.hot { border-color: #ffd166; box-shadow: 0 0 10px rgba(255, 209, 102, .5); }
</style>
</head>
<body>
<div id="badges"></div>
<div id="tab"></div>
<div id="guides"></div>
<div id="scanStatus"></div>
<div id="toast"></div>
<button id="scanBtn" class="interactive"></button>
<script type="module" src="overlay.js"></script>
</body>
</html>
