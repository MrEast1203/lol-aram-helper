<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://cdn.dtodo.cn https://ddragon.leagueoflegends.com data:; style-src 'self' 'unsafe-inline'">
<title>選角助手</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="panel.css">
<style>
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body { display: flex; flex-direction: column; border: 1px solid var(--gold); }
  header { -webkit-app-region: drag; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--bg2); border-bottom: 1px solid var(--line); color: var(--gold2); font-weight: 700; }
  header .grow { flex: 1; }
  header button { -webkit-app-region: no-drag; padding: 0 8px; }
  main { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
  .pool { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pool-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
  .pool-item:hover { border-color: var(--line); background: var(--bg2); }
  .pool-item.me { border-color: var(--gold); }
  .pool-item.sel { background: var(--bg3); }
  .pool-item .wr { font-size: 11px; color: var(--muted); }
  .pool-item.better .wr { color: #4ade80; }
  .aug-line { display: flex; align-items: center; gap: 6px; }
  .aug-line .name { flex: 1; }
  footer { padding: 4px 10px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header><span>ARAM Helper · 選角</span><span class="grow"></span><button id="close" title="本次隱藏">✕</button></header>
<main id="main"></main>
<footer id="footer"></footer>
<script type="module" src="champselect.js"></script>
</body>
</html>
